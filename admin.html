<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울미고 학생회 - 관리자</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="admin.js"></script>

<style>
  .addRow{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .addRow input{ margin-bottom:0; }
  .addRow button{
    width:auto;
    padding:0 16px;
    flex-shrink:0;
  }
  .studentIdTag{
    font-size:11.5px;
    color:var(--sub);
    font-weight:600;
    min-width:56px;
  }
</style>

</head>

<body>

<div id="gate" class="container">
  <div class="adminGate">
    <h1>관리자</h1>
    <p>비밀번호를 입력하세요</p>
    <div class="card">
      <input id="pwInput" type="password" placeholder="비밀번호" inputmode="numeric">
      <button id="pwBtn">입장</button>
    </div>
  </div>
</div>

<div id="adminContent" class="container hidden">

  <a href="index.html" class="backLink">← 처음으로</a>
  <h1>관리자 페이지</h1>
  <p>담당자 · 학생 데이터 · 로그 관리</p>

  <div class="countBox">
    <h3>우산 담당자 관리</h3>
    <div id="managerList"></div>
    <div class="addRow">
      <input id="newManagerName" placeholder="이름">
      <input id="newManagerPhone" placeholder="010-0000-0000">
      <button id="addManagerBtn">추가</button>
    </div>
  </div>

  <div class="countBox">
    <h3>급식선도 학생 데이터</h3>
    <div id="studentList"></div>
    <div class="addRow">
      <input id="newStudentId" placeholder="학번" style="max-width:90px;">
      <input id="newStudentName" placeholder="이름">
      <input id="newStudentCount" type="number" placeholder="횟수" style="max-width:70px;">
      <button id="addStudentBtn">추가</button>
    </div>
  </div>

  <div class="countBox">
    <h3>마이너스 처리 로그</h3>
    <div id="logList"></div>
  </div>

</div>

</body>
</html>
