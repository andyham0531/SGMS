
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박자게임</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top {
  width: 100%;
  padding: 12px 16px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.top h2 {
  margin: 0;
  font-size: 17px;
}

.backBtn {
  color: white;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 12px;
  background: #333;
  border-radius: 6px;
}

.videoBox {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.videoBox iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  height: auto;
  border: 0;
}

@media (orientation: landscape) {
  .top {
    padding: 5px 12px;
  }

  .videoBox {
    flex: 1;
  }

  .videoBox iframe {
    width: 100%;
    height: calc(100vh - 42px);
    aspect-ratio: auto;
  }
}
</style>
</head>

<body>

<div class="top">
  <h2 id="videoTitle">박자게임</h2>
  <a href="rhythm.html" class="backBtn">← 돌아가기</a>
</div>

<div class="videoBox">
  <iframe
    id="youtubeVideo"
    title="박자게임 영상"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>
</div>

<script>
const videos = [
  "pakknZh3eeo",
  "dq96G8c1eZA",
  "V80CDBj3Rsc",
  "6gy_YUTDxeQ",
  "-9E3jF-hZ1E"
];

const colors = ["빨강", "주황", "노랑", "초록", "파랑"];
const number = Number(new URLSearchParams(location.search).get("video"));

if (Number.isInteger(number) && number >= 0 && number < videos.length) {
  document.getElementById("videoTitle").textContent =
    colors[number] + " 박자게임";

  document.getElementById("youtubeVideo").src =
    "https://www.youtube.com/embed/" +
    videos[number] +
    "?autoplay=1&rel=0";
} else {
  document.getElementById("videoTitle").textContent =
    "영상을 선택해 주세요.";
}
</script>

</body>
</html>
