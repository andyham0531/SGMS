<!DOCTYPE html>

<head>

<link rel="stylesheet" href="style.css">

<script type="module" src="today-alert.js"></script>

<style>
  .todayEventCard{
    background:var(--navy-soft2);
    border-radius:0;
    padding:12px 14px;
    margin-bottom:8px;
    text-align:left;
  }
  .todayTypeBadge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 9px;
    border-radius:0;
    margin-bottom:6px;
    color:white;
    background:var(--navy-mid);
  }
  .todayTypeBadge.school{ background:var(--danger); }
  .todayEventTitle{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .todayEventMeta{
    font-size:12.5px;
    color:var(--sub);
    margin-top:2px;
  }
  .seeAllLink{
    display:block;
    text-align:center;
    margin-top:6px;
    color:var(--navy-mid);
    text-decoration:none;
    font-size:13px;

<body>

<div class="container">

    <div class="topBar">
        <a href="check.html">내 벌점 조회</a>
        <a href="umbrella-check.html">우산 조회</a>
        <a href="admin.html">관리자</a>
    </div>

    <div class="logoWrap">
        <img src="logo.jpg" alt="서울미고 로고">
    </div>

    <h1>서울미고 학생회</h1>

    <p>관리시스템</p>

    <h3 id="todayAlertTitle" style="color:var(--navy); margin-bottom:14px;">오늘의 일정</h3>
    <div id="todayAlertList"></div>
    <button id="todayAlertCloseBtn" style="margin-top:10px;">확인</button>
  </div>
