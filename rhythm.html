
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박자게임</title>
<link rel="stylesheet" href="style.css">
<style>
.rhythmButtons {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}
.rhythmBtn {
  width: 100%;
  padding: 22px;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}
.red { background: #ef4444; }
.orange { background: #f97316; }
.yellow { background: #eab308; color: #222; }
.green { background: #22a06b; }
.blue { background: #3b82f6; }
</style>
</head>
<body>
<div class="container">
  <h1>박자게임</h1>
  <p>원하는 색상의 버튼을 선택하세요.</p>

  <div class="rhythmButtons">
    <button class="rhythmBtn red" onclick="openVideo(0)">빨강</button>
    <button class="rhythmBtn orange" onclick="openVideo(1)">주황</button>
    <button class="rhythmBtn yellow" onclick="openVideo(2)">노랑</button>
    <button class="rhythmBtn green" onclick="openVideo(3)">초록</button>
    <button class="rhythmBtn blue" onclick="openVideo(4)">파랑</button>
  </div>
</div>

<script>
function openVideo(number) {
  location.href = "rhythm-video.html?video=" + number;
}
</script>
</body>
</html>
