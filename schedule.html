<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울미고 학생회 - 일정</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="schedule.js"></script>

<style>
  .calCard{
    background:white;
    border-radius:var(--radius);
    padding:16px;
    border:1px solid var(--line);
    margin-top:14px;
  }
  .calNav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .calNavBtn{
    width:auto;
    padding:7px 13px;
    font-size:15px;
    font-weight:600;
    background:var(--navy-soft2);
    color:var(--navy);
  }
  .monthLabel{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
  }
  .weekRow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekCell{
    text-align:center;
    font-size:11.5px;
    color:var(--sub);
    font-weight:600;
  }
  .weekCell.sun{ color:var(--danger); }
  .weekCell.sat{ color:var(--navy-mid); }
  .calGrid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .dayCell{
    min-height:88px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#FFFFFF;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:5px 3px;
    gap:2px;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .dayCell.has-school{ background:var(--danger-soft); border-color:var(--danger-soft); }
  .dayCell.has-council{ background:var(--navy-soft); border-color:var(--navy-soft); }
  .dayCell.today{ border-color:var(--navy); }
  .dayCell.blank{ visibility:hidden; cursor:default; }
  .dayNum{
    font-size:12px;
    font-weight:600;
    align-self:flex-start;
    margin-bottom:2px;
    color:var(--ink);
  }
  .dayNum.sun{ color:var(--danger); }
  .dayNum.sat{ color:var(--navy-mid); }
  .holidayLabel{
    font-size:8.5px;
    color:var(--danger);
    font-weight:600;
    margin-top:-3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dayEventChip{
    font-size:10px;
    font-weight:600;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:left;
  }
  .dayEventChip.council{ color:var(--navy); }
  .dayEventChip.school{ color:var(--danger); }
  .dayEventMore{
    font-size:9.5px;
    color:var(--sub);
    padding:0 4px;
    font-weight:600;
  }
  .legendRow{
    display:flex;
    gap:16px;
    justify-content:center;
    margin-top:12px;
    font-size:12px;
    color:var(--sub);
  }
  .legendDot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
  }
  .eventBtns{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .editOneBtn{
    width:auto;
    padding:6px 12px;
    font-size:12.5px;
    background:var(--navy-soft2);
    color:var(--navy-mid);
    font-weight:600;
  }
  #dayModal .modalCard{
    max-height:85vh;
    overflow-y:auto;
  }
  #dayModal h3{
    margin-bottom:14px;
    color:var(--navy);
  }
  #modalEventList{ margin-bottom:16px; }
  #modalEventList .eventCard{
    background:var(--navy-soft2);
    padding:12px 14px;
    border:none;
  }
  .typeSwitch{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .typeBtn{
    flex:1;
    padding:11px;
    border:1px solid var(--line);
    border-radius:10px;
    background:white;
    color:var(--sub);
    font-weight:600;
    cursor:pointer;
    font-size:13.5px;
  }
  .typeBtn.active.council{ background:var(--navy-soft); color:var(--navy); border-color:var(--navy); }
  .typeBtn.active.school{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }
  #cancelEditBtn{
    background:var(--navy-soft2);
    color:var(--navy-mid);
    margin-bottom:10px;
  }
  .dayCell.jump-highlight{
    animation:jumpPulse 0.9s ease 2;
    z-index:1;
  }
  @keyframes jumpPulse{
    0%{ box-shadow:0 0 0 0 rgba(27,58,107,.5); }
    70%{ box-shadow:0 0 0 8px rgba(27,58,107,0); }
    100%{ box-shadow:0 0 0 0 rgba(27,58,107,0); }
  }
  .eventCard[data-jump-date]{ cursor:pointer; }
</style>

</head>

<body class="page-navy">

<div class="container">

<a href="index.html" class="backLink">← 처음으로</a>

<h1>학생회 일정</h1>
<p>날짜를 눌러 일정을 등록하거나 확인하세요</p>

<div class="calCard">
  <div class="calNav">
    <button id="prevMonthBtn" class="calNavBtn">‹</button>
    <span id="monthLabel" class="monthLabel"></span>
    <button id="nextMonthBtn" class="calNavBtn">›</button>
  </div>
  <div class="weekRow">
    <div class="weekCell sun">일</div>
    <div class="weekCell">월</div>
    <div class="weekCell">화</div>
    <div class="weekCell">수</div>
    <div class="weekCell">목</div>
    <div class="weekCell">금</div>
    <div class="weekCell sat">토</div>
  </div>
  <div id="calGrid" class="calGrid"></div>

  <div class="legendRow">
    <span><span class="legendDot" style="background:var(--navy);"></span>학생회 일정</span>
    <span><span class="legendDot" style="background:var(--danger);"></span>전체 일정 / 공휴일</span>
  </div>
</div>

<div class="sectionLabel">다가오는 일정</div>
<div id="upcomingList"></div>

</div>

<div id="dayModal" class="modal hidden">
  <div class="modalCard">
    <h3 id="modalDateLabel"></h3>

    <div id="modalEventList"></div>

    <label class="smallLabel" id="formLabel">새 일정 등록</label>

    <button id="cancelEditBtn" class="hidden">수정 취소</button>

    <div class="typeSwitch">
      <button type="button" id="typeCouncilBtn" class="typeBtn council active">학생회 일정</button>
      <button type="button" id="typeSchoolBtn" class="typeBtn school">전체 일정</button>
    </div>

    <input id="eventTitle" placeholder="일정 제목 (예: 정기 회의)">
    <input id="eventPlace" placeholder="장소 (선택)">
    <input id="eventOwner" placeholder="담당 (선택)">
    <input id="eventMemo" placeholder="메모 (선택)">

    <div class="modalButtons">
      <button id="saveBtn">등록</button>
      <button id="closeModalBtn" style="background:var(--navy-soft2); color:var(--ink);">닫기</button>
    </div>
  </div>
</div>

</body>
</html>
