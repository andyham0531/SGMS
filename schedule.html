<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGMS - 학생회 일정</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="schedule.js"></script>

<style>
  .calCard{
    background:white;
    border-radius:18px;
    padding:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-top:15px;
  }
  .calNav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .calNavBtn{
    width:auto;
    padding:8px 14px;
    font-size:16px;
    font-weight:700;
    background:#f4f4f4;
    color:#333;
    border-radius:10px;
  }
  .monthLabel{
    font-size:18px;
    font-weight:700;
  }
  .weekRow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekCell{
    text-align:center;
    font-size:12px;
    color:#8e8e93;
    font-weight:600;
  }
  .calGrid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .dayCell{
    min-height:92px;
    border:none;
    border-radius:8px;
    background:#f9f9fb;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:5px 3px;
    gap:2px;
    font-size:12px;
    color:#333;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .dayCell.today .dayNum{
    background:#007AFF;
    color:white;
  }
  .dayCell.blank{
    visibility:hidden;
    cursor:default;
  }
  .dayNum{
    font-size:12px;
    font-weight:600;
    width:20px;
    height:20px;
    line-height:20px;
    text-align:center;
    border-radius:50%;
    align-self:flex-start;
    margin-bottom:2px;
  }
  .dayEventChip{
    font-size:10px;
    font-weight:700;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:left;
  }
  .dayEventChip.c0{ color:#007AFF; }
  .dayEventChip.c1{ color:#ff3b30; }
  .dayEventChip.c2{ color:#34c759; }
  .dayEventChip.c3{ color:#333; }
  .dayEventChip.c4{ color:#5856d6; }
  .dayEventMore{
    font-size:9.5px;
    color:#8e8e93;
    padding:0 4px;
    font-weight:600;
  }
  .sectionLabel{
    font-size:13px;
    font-weight:700;
    color:#8e8e93;
    margin:22px 0 10px 4px;
  }
  .eventCard{
    background:white;
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:10px;
  }
  .eventTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .eventDateBadge{
    display:inline-block;
    background:#34c759;
    color:white;
    font-size:11px;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .eventTitle{
    font-size:16px;
    font-weight:700;
  }
  .eventMeta{
    font-size:12.5px;
    color:#666;
    margin-top:2px;
  }
  .eventMemo{
    font-size:12.5px;
    color:#444;
    margin-top:6px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .emptyMsg{
    text-align:center;
    color:#999;
    font-size:13px;
    padding:16px 0;
  }
  /* 날짜 클릭 모달 */
  #dayModal .modalCard{
    max-height:80vh;
    overflow-y:auto;
  }
  #dayModal h3{
    margin-bottom:14px;
  }
  #modalEventList{
    margin-bottom:16px;
  }
  #modalEventList .eventCard{
    box-shadow:none;
    background:#f9f9fb;
    padding:12px 14px;
  }
</style>

</head>

<body>

<div class="container">

<a href="index.html" class="backLink">← 처음으로</a>

<h1>📅 학생회 일정</h1>
<p>날짜를 눌러 일정을 등록하거나 확인하세요</p>

<div class="calCard">
  <div class="calNav">
    <button id="prevMonthBtn" class="calNavBtn">‹</button>
    <span id="monthLabel" class="monthLabel"></span>
    <button id="nextMonthBtn" class="calNavBtn">›</button>
  </div>
  <div class="weekRow">
    <div class="weekCell">일</div>
    <div class="weekCell">월</div>
    <div class="weekCell">화</div>
    <div class="weekCell">수</div>
    <div class="weekCell">목</div>
    <div class="weekCell">금</div>
    <div class="weekCell">토</div>
  </div>
  <div id="calGrid" class="calGrid"></div>
</div>

<div class="sectionLabel">다가오는 일정</div>
<div id="upcomingList"></div>

</div>

<!-- 날짜 클릭 시 뜨는 모달: 해당 날짜 일정 목록 + 등록 폼 -->
<div id="dayModal" class="modal hidden">
  <div class="modalCard">
    <h3 id="modalDateLabel"></h3>

    <div id="modalEventList"></div>

    <label class="smallLabel">새 일정 등록</label>
    <input id="eventTitle" placeholder="일정 제목 (예: 정기 회의)">
    <input id="eventPlace" placeholder="장소 (선택)">
    <input id="eventOwner" placeholder="담당 (선택)">
    <input id="eventMemo" placeholder="메모 (선택)">

    <div class="modalButtons">
      <button id="saveBtn">등록</button>
      <button id="closeModalBtn" style="background:#8e8e93;">닫기</button>
    </div>
  </div>
</div>

</body>
</html>
